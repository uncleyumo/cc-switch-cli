version: 2

project_name: ccsc

builds:
  - id: ccsc
    main: .
    binary: ccsc
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/uncleyumo/ccsc/internal/version.Version={{ .Version }}
      - -X github.com/uncleyumo/ccsc/internal/version.Commit={{ .Commit }}
      - -X github.com/uncleyumo/ccsc/internal/version.Date={{ .Date }}

archives:
  # The asset name must match internal/update.AssetName(): ccsc_<goos>_<goarch>.zip
  - id: default
    formats:
      - zip
    name_template: "ccsc_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
